<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic 15 Puzzle</title>
<style>
    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #E0F7FA;
        margin: 0;
        padding-top: 40px;
        color: #333;
    }
    h1 {
        font-size: 48px;
        margin: 0 0 20px 0;
        color: #FF4081;
        text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
    }
    #board {
        position: relative;
        width: 404px;
        height: 404px;
        background-color: #B39DDB;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .tile {
        position: absolute;
        width: 96px;
        height: 96px;
        color: white;
        font-size: 44px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 16px;
        cursor: pointer;
        transition: transform 0.15s ease-in-out, filter 0.15s;
        user-select: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .tile:hover {
        filter: brightness(1.1);
    }
    #message {
        margin-top: 20px;
        font-size: 32px;
        font-weight: bold;
        color: #FF9800;
        text-shadow: 1px 1px 0px #FFF;
        height: 35px;
    }
    .controls {
        margin-top: 10px;
    }
    button {
        padding: 12px 32px;
        font-size: 20px;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
        font-weight: bold;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        transition: transform 0.1s, background-color 0.15s;
    }
    button:hover {
        background-color: #45a049;
        transform: scale(1.05);
    }
    button:active {
        transform: scale(0.95);
    }
</style>
</head>
<body>

<h1>15 Puzzle</h1>
<div id="board"></div>
<div id="message"></div>
<div class="controls">
    <button onclick="shuffle()">Shuffle</button>
</div>

<script>
    const SIZE = 4;
    const TILE_SIZE = 100;
    const OFFSET = 4;
    let tiles = [];
    let emptyPos = { r: SIZE - 1, c: SIZE - 1 };
    let isShuffling = false;

    const board = document.getElementById('board');
    const message = document.getElementById('message');

    // Fun colors for tiles
    const tileColors = [
        '#F44336', '#E91E63', '#9C27B0', '#673AB7',
        '#3F51B5', '#2196F3', '#03A9F4', '#00BCD4',
        '#009688', '#4CAF50', '#8BC34A', '#CDDC39',
        '#FFC107', '#FF9800', '#FF5722'
    ];

    // Initialize the board
    function init() {
        board.innerHTML = '';
        tiles = [];
        let num = 1;
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (r === SIZE - 1 && c === SIZE - 1) {
                    tiles.push(0); // 0 represents the empty space
                    continue;
                }
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.textContent = num;
                tile.id = `tile-${num}`;
                tile.style.backgroundColor = tileColors[num - 1];

                // Set initial position
                setTilePosition(tile, r, c);

                // Add click event
                tile.addEventListener('click', () => moveTile(parseInt(tile.textContent)));

                board.appendChild(tile);
                tiles.push(num);
                num++;
            }
        }
        emptyPos = { r: SIZE - 1, c: SIZE - 1 };
        message.textContent = '';
    }

    function setTilePosition(tile, r, c) {
        tile.style.transform = `translate(${c * TILE_SIZE + OFFSET}px, ${r * TILE_SIZE + OFFSET}px)`;
    }

    function getIndex(r, c) {
        return r * SIZE + c;
    }

    function moveTile(num) {
        const index = tiles.indexOf(num);
        const r = Math.floor(index / SIZE);
        const c = index % SIZE;

        // Check if adjacent to empty space
        if ((Math.abs(r - emptyPos.r) === 1 && c === emptyPos.c) ||
            (Math.abs(c - emptyPos.c) === 1 && r === emptyPos.r)) {

            // Swap in array
            const emptyIndex = getIndex(emptyPos.r, emptyPos.c);
            tiles[emptyIndex] = num;
            tiles[index] = 0;

            // Update empty position
            const newEmptyR = r;
            const newEmptyC = c;

            // Update DOM
            const tile = document.getElementById(`tile-${num}`);
            setTilePosition(tile, emptyPos.r, emptyPos.c);

            emptyPos = { r: newEmptyR, c: newEmptyC };

            if (!isShuffling) {
                checkWin();
            }
        }
    }

    function checkWin() {
        for (let i = 0; i < SIZE * SIZE - 1; i++) {
            if (tiles[i] !== i + 1) {
                return false;
            }
        }
        message.textContent = 'You Win!';
        return true;
    }

    function shuffle() {
        isShuffling = true;
        message.textContent = '';

        // Fisher-Yates shuffle
        for (let i = tiles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }

        // Check if the puzzle is solvable
        let inversions = 0;
        let emptyRow = 0;
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i] === 0) {
                emptyRow = Math.floor(i / SIZE);
                continue;
            }
            for (let j = i + 1; j < tiles.length; j++) {
                if (tiles[j] !== 0 && tiles[i] > tiles[j]) {
                    inversions++;
                }
            }
        }

        // Solvability rule for a grid of even width (like 4x4):
        // If the empty square is on an even row counting from the bottom (1-indexed, meaning rowFromBottom = 2, 4), then the number of inversions must be odd.
        // If the empty square is on an odd row counting from the bottom (rowFromBottom = 1, 3), then the number of inversions must be even.
        const rowFromBottom = SIZE - emptyRow;
        let isSolvable = (rowFromBottom % 2 === 0) ? (inversions % 2 !== 0) : (inversions % 2 === 0);

        if (!isSolvable) {
            // Swap the first two adjacent tiles that are not the empty space
            if (tiles[0] !== 0 && tiles[1] !== 0) {
                [tiles[0], tiles[1]] = [tiles[1], tiles[0]];
            } else {
                [tiles[2], tiles[3]] = [tiles[3], tiles[2]];
            }
        }

        // Update DOM positions after shuffling
        for (let i = 0; i < tiles.length; i++) {
            const num = tiles[i];
            if (num !== 0) {
                const r = Math.floor(i / SIZE);
                const c = i % SIZE;
                const tile = document.getElementById(`tile-${num}`);
                // Temporary remove transition for instant shuffle
                tile.style.transition = 'none';
                setTilePosition(tile, r, c);
                // Force reflow
                void tile.offsetWidth;
                tile.style.transition = 'transform 0.15s ease-in-out';
            } else {
                emptyPos = { r: Math.floor(i / SIZE), c: i % SIZE };
            }
        }

        isShuffling = false;
    }

    // Initialize and shuffle on load
    init();
    shuffle();
</script>
</body>
</html>
